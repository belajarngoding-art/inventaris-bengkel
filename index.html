<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:var(--navy);color:#d8e2f0;padding:22px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 26px}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#2563eb);display:grid;place-items:center;color:white;font-weight:900;font-size:18px}.brand b{font-size:18px;letter-spacing:.5px;color:white}.brand small{display:block;color:#8fa4bf;font-size:10px;letter-spacing:1.4px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#8093ac;padding:12px 12px 7px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:#b9c8db;background:transparent;text-align:left;width:100%;font-size:13px}.nav button:hover,.nav button.active{background:#263c59;color:white}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;border-top:1px solid #ffffff1c;padding:16px 8px 0;color:#91a4bc;font-size:11px}.main{margin-left:250px;min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:4}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--text);font-size:15px}.topright{display:flex;align-items:center;gap:14px}.rolepill{background:#eef4ff;color:#2456ad;border-radius:20px;padding:7px 11px;font-size:11px;font-weight:700}.avatar{width:35px;height:35px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}.content{padding:28px 32px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:23px}.pagehead h1{font-size:24px;margin:0 0 4px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px}.btn{padding:9px 14px;border-radius:8px;font-weight:650;font-size:12px;display:inline-flex;align-items:center;gap:7px}.primary{background:var(--blue);color:white}.primary:hover{background:#1d4ed8}.secondary{background:#eef2f7;color:#334155}.success{background:#e7f7ef;color:#087849}.danger{background:#fff0f0;color:#c53c3c}.warning{background:#fff5e5;color:#a96000}.outline{background:white;border:1px solid var(--line);color:#334155}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:var(--shadow)}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{width:32px;height:32px;border-radius:9px;background:#eff5ff;display:grid;place-items:center;font-size:16px}.statnum{font-size:27px;font-weight:800;margin:10px 0 1px;letter-spacing:-1px}.statfoot{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}.panel{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:17px;overflow:hidden}.panelhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panelhead h3{margin:0;font-size:14px}.panelbody{padding:17px 19px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;background:#f8fafc;color:#748196;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px 15px;font-weight:700}td{padding:12px 15px;border-top:1px solid #edf0f5;font-size:12px}tbody tr:hover{background:#fafcff}.toolname{font-weight:700;color:#1e293b}.muted{color:var(--muted)}.tag{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}.tag.green{background:#e8f7ef;color:#128052}.tag.orange{background:#fff4df;color:#a96500}.tag.red{background:#ffeded;color:#bd3939}.tag.blue{background:#eaf1ff;color:#2856b2}.tag.gray{background:#eef1f5;color:#596579}.filters{display:flex;gap:9px;flex-wrap:wrap;padding:14px 17px;border-bottom:1px solid var(--line)}.field{display:grid;gap:5px;margin-bottom:13px}.field label{font-size:11px;font-weight:700;color:#475569}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;border:1px solid #dce3ed;border-radius:8px;padding:9px 10px;background:white;outline:none;color:#1e293b;font-size:12px}.field input:focus,.field select:focus,.field textarea:focus,.filters input:focus{border-color:#76a4f8;box-shadow:0 0 0 3px #2563eb12}.filters input{max-width:250px}.filters select{width:auto;min-width:135px}.actions{display:flex;gap:6px}.iconbtn{background:#f1f5f9;border-radius:7px;padding:6px 8px;color:#475569}.empty{text-align:center;padding:35px;color:#8995a7}.notice{padding:12px 14px;border-radius:9px;background:#eff6ff;color:#315b9d;font-size:12px;margin-bottom:15px}.notice strong{display:block;margin-bottom:3px}.quicklist{display:grid;gap:12px}.quickrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.quickrow b{font-size:12px}.quickrow small{display:block;color:var(--muted);font-size:10px}.progress{height:6px;border-radius:8px;background:#edf1f6;margin-top:7px;overflow:hidden}.progress span{display:block;height:100%;background:#3b82f6;border-radius:8px}.modalback{position:fixed;inset:0;background:#0b1728a8;z-index:20;display:grid;place-items:center;padding:18px}.modal{background:white;border-radius:14px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 80px #0003}.modalhead{padding:18px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0;font-size:16px}.modalbody{padding:20px}.modalfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.span2{grid-column:span 2}.toast{position:fixed;right:22px;bottom:22px;background:#172b45;color:white;padding:12px 17px;border-radius:9px;box-shadow:0 10px 35px #0003;z-index:40;font-size:12px}.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:white}.loginleft{background:linear-gradient(145deg,#166534,#1d4774);color:white;padding:8vw;display:flex;flex-direction:column;justify-content:center}.loginleft h1{font-size:42px;line-height:1.12;margin:25px 0 12px;letter-spacing:-1.5px}.loginleft p{color:#c1d4e8;max-width:440px}.loginright{display:grid;place-items:center;padding:30px}.loginbox{width:min(390px,100%)}.loginbox h2{font-size:25px;margin:0 0 5px}.loginbox .sub{margin-bottom:26px}.demo{background:#f5f8fc;padding:12px;border-radius:9px;font-size:11px;color:#637189;margin-top:18px}.demo div{margin-top:5px}.mobilehead{display:none}.cataloggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.toolcard{border:1px solid var(--line);border-radius:12px;padding:17px;background:white}.tooltop{display:flex;justify-content:space-between;align-items:start}.toolemoji{width:42px;height:42px;background:#eff5ff;border-radius:11px;display:grid;place-items:center;font-size:22px}.toolcard h3{font-size:14px;margin:13px 0 3px}.toolcard p{font-size:11px;color:var(--muted);margin:0 0 14px}.toolmeta{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px;font-size:11px;color:var(--muted)}.toolmeta b{color:#1e293b}.reportcards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.reportbox{padding:16px;background:#f8fafc;border-radius:10px}.reportbox small{color:var(--muted)}.reportbox strong{display:block;font-size:23px;margin-top:5px}.hidden{display:none!important}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.cataloggrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{width:0;padding:0;overflow:hidden}.main{margin-left:0}.topbar{height:62px;padding:0 16px}.content{padding:20px 15px}.mobilehead{display:block}.topright .rolepill{display:none}.grid2{grid-template-columns:1fr}.pagehead{align-items:center}.pagehead h1{font-size:20px}.stats{gap:9px}.stat{padding:13px}.statnum{font-size:23px}.cataloggrid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.loginleft{display:none}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.reportcards{grid-template-columns:1fr 1fr}.filters input{max-width:none;flex:1}.topbar:before{content:'SIPALI';font-weight:850;color:#1e3a5f}.crumb{display:none}}

<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10), plus=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const seed={
 users:[
 {id:1,name:'Administrator SIPALI',username:'admin',password:'admin123',role:'Admin / PLP',contact:'admin@smkn1beringin.sch.id',active:true},
 {id:2,name:'Kepala Bengkel',username:'kepala',password:'kepala123',role:'Kepala Bengkel',contact:'kepala@smkn1beringin.sch.id',active:true},
 {id:3,name:'Budi Santoso',username:'guru',password:'guru123',role:'Guru',contact:'budi@sekolah.sch.id',active:true},
 {id:4,name:'Andi Pratama',username:'siswa',password:'siswa123',role:'Siswa',contact:'andi@ siswa.sch.id',active:true}],
 tools:[
 {id:1,code:'TI-001',name:'Multimeter Digital',category:'Alat Ukur',spec:'Digital, auto range',total:8,condition:'Baik',active:true,emoji:'🔌'},
 {id:2,code:'TI-002',name:'Tang Crimping',category:'Perkakas Jaringan',spec:'RJ45/RJ11',total:12,condition:'Baik',active:true,emoji:'🛠️'},
 {id:3,code:'TI-003',name:'Laptop Praktik',category:'Komputer',spec:'Core i5, RAM 8GB',total:10,condition:'Baik',active:true,emoji:'💻'},
 {id:4,code:'TI-004',name:'Access Point Indoor',category:'Jaringan',spec:'Dual band 2.4/5GHz',total:6,condition:'Baik',active:true,emoji:'📡'},
 {id:5,code:'TI-005',name:'Kabel LAN Tester',category:'Alat Ukur',spec:'RJ45 network tester',total:5,condition:'Perlu Perbaikan',active:true,emoji:'🧰'},
 {id:6,code:'TI-006',name:'Obeng Set',category:'Perkakas',spec:'Set presisi 32-in-1',total:15,condition:'Baik',active:true,emoji:'🔧'}],
 loans:[],notifications:[],audit:[],returns:[]
};
let db,me=null,page='dashboard',filter='',statusFilter='Semua';
function load(){try{db=JSON.parse(localStorage.getItem('sipali_db'))||structuredClone(seed)}catch(e){db=structuredClone(seed)}}
function save(){localStorage.setItem('sipali_db',JSON.stringify(db))}
function log(action,obj){db.audit.unshift({id:Date.now(),user:me?.name||'Sistem',action,obj,time:new Date().toLocaleString('id-ID')});save()}
function isStaff(){return ['Admin / PLP','Kepala Bengkel'].includes(me?.role)}
function isAdmin(){return me?.role==='Admin / PLP'}
function activeQty(tool){return db.loans.filter(l=>l.status==='Disetujui'&&l.items.some(i=>i.toolId===tool.id)).reduce((s,l)=>s+l.items.filter(i=>i.toolId===tool.id).reduce((a,i)=>a+i.qty,0),0)}
function available(t){return Math.max(0,t.total-activeQty(t)-(['Perlu Perbaikan','Rusak','Hilang'].includes(t.condition)?t.total:0))}
function statusTag(s){let c={'Disetujui':'green','Menunggu Verifikasi':'orange','Ditolak':'red','Selesai':'gray','Terlambat':'red','Dalam Perbaikan':'orange','Hilang':'red'}[s]||'blue';return `<span class="tag ${c}">${esc(s)}</span>`}
function toast(m){let n=document.createElement('div');n.className='toast';n.textContent=m;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function login(){let u=$('#username').value.trim(),p=$('#password').value;let user=db.users.find(x=>x.username===u&&x.password===p&&x.active);if(!user){toast('Username atau password salah / akun tidak aktif');return}me=user;page='dashboard';render()}
function logout(){me=null;render()}
function navItems(){let items=[['dashboard','▦','Dashboard'],['catalog','▤','Katalog Alat'],['loans','⇄','Peminjaman'],['returns','↩','Pengembalian'],['inventory','▣','Inventaris'],['reports','▥','Laporan'],['notifications','♢','Notifikasi'],['users','♙','Pengguna'],['audit','◷','Audit Log']];return items.filter(x=>{if(['inventory','users','audit','returns'].includes(x[0]))return isAdmin();if(x[0]==='reports')return isStaff();return true})}
function shell(){return `<aside class="sidebar"><div class="brand"><div class="brandmark">S</div><div><b>SIPALI</b><small>BENGKEL TI</small></div></div><div class="navlabel">Menu utama</div><nav class="nav">${navItems().map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}</nav><div class="sidebottom">SIPALI v1.0 · SMKN 1 Beringin<br>Digitalisasi inventaris bengkel TI</div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace / <strong>${navItems().find(x=>x[0]===page)?.[2]||'Dashboard'}</strong></div><div class="topright"><span class="rolepill">${esc(me.role)}</span><div class="avatar">${esc(me.name[0])}</div><div><b style="font-size:12px">${esc(me.name)}</b><div class="muted" style="font-size:10px">${esc(me.username)}</div></div><button class="iconbtn" onclick="logout()" title="Keluar">⇥</button></div></header><section class="content" id="view"></section></main>`}
function head(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function stat(label,num,icon,foot){return `<div class="stat"><div class="stathead">${label}<span class="staticon">${icon}</span></div><div class="statnum">${num}</div><div class="statfoot">${foot}</div></div>`}
function dashboard(){let total=db.tools.filter(t=>t.active).reduce((a,t)=>a+t.total,0),avail=db.tools.filter(t=>t.active).reduce((a,t)=>a+available(t),0),borrow=db.loans.filter(l=>l.status==='Disetujui').length,pending=db.loans.filter(l=>l.status==='Menunggu Verifikasi').length,late=db.loans.filter(l=>l.status==='Disetujui'&&l.due<today()).length;
let rows=db.loans.slice().sort((a,b)=>b.id-a.id).slice(0,6);
return `${head('Dashboard','Ringkasan aktivitas dan kondisi inventaris bengkel TI')}<div class="stats">${stat('Total unit inventaris',total,'▣','Seluruh alat terdaftar')}${stat('Unit tersedia',avail,'✓','Siap dipinjam')}${stat('Peminjaman aktif',borrow,'⇄','Transaksi disetujui')}${stat('Menunggu verifikasi',pending,'◷','Perlu ditindaklanjuti')}</div><div class="grid2"><div class="panel"><div class="panelhead"><h3>Transaksi terbaru</h3><button class="btn outline" onclick="go('loans')">Lihat semua →</button></div><div class="tablewrap"><table><thead><tr><th>Peminjam</th><th>Tanggal</th><th>Jatuh tempo</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(l=>`<tr><td><b>${esc(l.borrower)}</b><div class="muted">${esc(l.code)}</div></td><td>${l.start}</td><td>${l.due}</td><td>${statusTag(l.status==='Disetujui'&&l.due<today()?'Terlambat':l.status)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada transaksi peminjaman</td></tr>'}</tbody></table></div></div><div class="panel"><div class="panelhead"><h3>Ringkasan kondisi alat</h3><span class="muted">Inventaris aktif</span></div><div class="panelbody quicklist">${['Baik','Perlu Perbaikan','Rusak'].map(c=>{let n=db.tools.filter(t=>t.active&&t.condition===c).reduce((a,t)=>a+t.total,0);return `<div><div class="quickrow"><b>${c}</b><strong>${n} unit</strong></div><div class="progress"><span style="width:${total?n/total*100:0}%;background:${c==='Baik'?'#16a36a':c==='Rusak'?'#dc4c4c':'#e58b18'}"></span></div></div>`}).join('')}<div class="notice" style="margin:8px 0 0"><strong>${late} transaksi terlambat</strong>Periksa daftar peminjaman dan tindak lanjuti pengembalian.</div></div></div></div>`}
function catalog(){let arr=db.tools.filter(t=>t.active&&(`${t.name} ${t.code} ${t.category}`).toLowerCase().includes(filter.toLowerCase()));return `${head('Katalog Alat','Cari alat bengkel dan lihat ketersediaan untuk pengajuan peminjaman',isAdmin()?'<div class="actions"><button class="btn outline" onclick="downloadTemplate(\'tools\')">⇩ Template Excel</button><button class="btn success" onclick="openImport(\'tools\')">⇧ Impor Excel</button></div>':'')}<div class="filters"><input placeholder="Cari nama, kode, kategori..." value="${esc(filter)}" oninput="filter=this.value;refresh()"><select id="catfilter" onchange="filterCategory(this.value)"><option>Semua kategori</option>${[...new Set(db.tools.map(t=>t.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="cataloggrid">${arr.map(t=>`<article class="toolcard"><div class="tooltop"><div class="toolemoji">${t.emoji||'🧰'}</div>${statusTag(t.condition)}</div><h3>${esc(t.name)}</h3><p>${esc(t.code)} · ${esc(t.category)}<br>${esc(t.spec)}</p><div class="toolmeta"><span>Tersedia <b>${available(t)} / ${t.total}</b></span>${!isStaff()?`<button class="btn primary" onclick="openLoan(${t.id})" ${available(t)<=0?'disabled':''}>Ajukan +</button>`:''}</div></article>`).join('')||'<div class="empty">Alat tidak ditemukan.</div>'}</div>`}
function filterCategory(v){let q=v==='Semua kategori'?'':v;filter=q;refresh()}
function loans(){let list=db.loans.filter(l=>(isStaff()||l.userId===me.id)&&(`${l.borrower} ${l.code} ${l.id}`).toLowerCase().includes(filter.toLowerCase())&&(statusFilter==='Semua'||l.status===statusFilter));return `${head('Peminjaman','Pengajuan, verifikasi, dan pemantauan transaksi',!isStaff()?'<button class="btn primary" onclick="openLoan()">＋ Ajukan peminjaman</button>':'')}<div class="filters"><input placeholder="Cari peminjam / kode transaksi..." value="${esc(filter)}" oninput="filter=this.value;refresh()"><select onchange="statusFilter=this.value;refresh()">${['Semua','Menunggu Verifikasi','Disetujui','Ditolak','Selesai'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Kode / Peminjam</th><th>Alat</th><th>Tgl pinjam</th><th>Jatuh tempo</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(l=>`<tr><td><b>${l.code}</b><div class="muted">${esc(l.borrower)}</div></td><td>${l.items.map(i=>`${esc(db.tools.find(t=>t.id===i.toolId)?.name||'Alat dihapus')} × ${i.qty}`).join('<br>')}</td><td>${l.start}</td><td>${l.due}</td><td>${statusTag(l.status==='Disetujui'&&l.due<today()?'Terlambat':l.status)}</td><td><div class="actions">${isStaff()&&l.status==='Menunggu Verifikasi'?`<button class="btn success" onclick="decide(${l.id},true)">Setujui</button><button class="btn danger" onclick="decide(${l.id},false)">Tolak</button>`:''}${isAdmin()&&l.status==='Disetujui'?`<button class="btn primary" onclick="openReturn(${l.id})">Proses kembali</button>`:''}${l.status==='Menunggu Verifikasi'&&l.userId===me.id?`<button class="btn danger" onclick="cancelLoan(${l.id})">Batalkan</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Tidak ada transaksi.</td></tr>'}</tbody></table></div></div>`}
function inventory(){return `${head('Inventaris Alat','Kelola data, stok, kategori, dan kondisi alat','<div class="actions"><button class="btn outline" onclick="downloadTemplate(\'tools\')">⇩ Template Excel</button><button class="btn success" onclick="openImport(\'tools\')">⇧ Impor Excel</button><button class="btn primary" onclick="openTool()">＋ Tambah alat</button></div>')}<div class="filters"><input placeholder="Cari nama / kode alat..." value="${esc(filter)}" oninput="filter=this.value;refresh()"></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Kode aset</th><th>Nama alat</th><th>Kategori</th><th>Total unit</th><th>Dipinjam</th><th>Tersedia</th><th>Kondisi</th><th>Aksi</th></tr></thead><tbody>${db.tools.filter(t=>t.active&&(`${t.name} ${t.code}`).toLowerCase().includes(filter.toLowerCase())).map(t=>`<tr><td><b>${esc(t.code)}</b></td><td><b>${esc(t.name)}</b><div class="muted">${esc(t.spec)}</div></td><td>${esc(t.category)}</td><td>${t.total}</td><td>${activeQty(t)}</td><td><b>${available(t)}</b></td><td>${statusTag(t.condition)}</td><td><div class="actions"><button class="iconbtn" onclick="openTool(${t.id})">✎</button><button class="iconbtn" onclick="deleteTool(${t.id})">⌫</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Belum ada data alat.</td></tr>'}</tbody></table></div></div>`}
function returnsPage(){let list=db.loans.filter(l=>l.status==='Disetujui');return `${head('Pengembalian Alat','Pemeriksaan kondisi alat dan penyelesaian transaksi')}<div class="panel"><div class="tablewrap"><table><thead><tr><th>Transaksi</th><th>Peminjam</th><th>Alat</th><th>Jatuh tempo</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(l=>`<tr><td><b>${l.code}</b></td><td>${esc(l.borrower)}</td><td>${l.items.map(i=>`${esc(db.tools.find(t=>t.id===i.toolId)?.name||'Alat')} ×${i.qty}`).join('<br>')}</td><td>${l.due}</td><td>${statusTag(l.due<today()?'Terlambat':'Disetujui')}</td><td><button class="btn primary" onclick="openReturn(${l.id})">Catat pengembalian</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Tidak ada alat yang sedang dipinjam.</td></tr>'}</tbody></table></div></div>`}
function users(){return `${head('Manajemen Pengguna','Kelola akun dan peran pengguna SIPALI','<div class="actions"><button class="btn outline" onclick="downloadTemplate(\'users\')">⇩ Template Excel</button><button class="btn success" onclick="openImport(\'users\')">⇧ Impor Excel</button><button class="btn primary" onclick="openUser()">＋ Tambah pengguna</button></div>')}<div class="panel"><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Username</th><th>Kontak</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${esc(u.contact)}</td><td>${esc(u.role)}</td><td>${u.active?'<span class="tag green">Aktif</span>':'<span class="tag gray">Nonaktif</span>'}</td><td><button class="btn outline" onclick="toggleUser(${u.id})">${u.active?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function notifications(){let ns=db.notifications.filter(n=>n.userId===me.id||isAdmin());return `${head('Notifikasi','Informasi status pengajuan dan pengingat jatuh tempo')}<div class="panel">${ns.length?ns.map(n=>`<div class="panelbody" style="border-bottom:1px solid var(--line)"><div class="quickrow"><b>${esc(n.title)}</b><small>${n.time}</small></div><div class="muted" style="margin-top:5px">${esc(n.message)}</div></div>`).join(''):'<div class="empty">Belum ada notifikasi.</div>'}</div>`}
let reportFrom='',reportTo='',reportCategory='Semua';
function inReportPeriod(date,from=reportFrom,to=reportTo){return !!date&&(!from||date>=from)&&(!to||date<=to)}
function reportTable(headers,rows,empty='Tidak ada data pada periode yang dipilih.'){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function reports(){
 let total=db.tools.reduce((a,t)=>a+t.total,0),active=db.loans.filter(l=>l.status==='Disetujui').length,done=db.loans.filter(l=>l.status==='Selesai').length,late=db.loans.filter(l=>l.status==='Disetujui'&&l.due<today()).length;
 let categories=['Semua',...new Set(db.tools.map(t=>t.category).filter(Boolean))];
 let periodLoans=db.loans.filter(l=>inReportPeriod(l.start));
 let filteredLoans=periodLoans.filter(l=>l.items.some(i=>{let t=db.tools.find(x=>x.id===i.toolId);return t&&(reportCategory==='Semua'||t.category===reportCategory)}));
 let outstanding=filteredLoans.filter(l=>l.status==='Disetujui').flatMap(l=>l.items.map(i=>{let t=db.tools.find(x=>x.id===i.toolId);return {l,i,t}}).filter(x=>x.t&&(reportCategory==='Semua'||x.t.category===reportCategory)));
 let borrowCounts=new Map();
 periodLoans.filter(l=>['Disetujui','Selesai'].includes(l.status)).forEach(l=>l.items.forEach(i=>{let t=db.tools.find(x=>x.id===i.toolId);if(t&&(reportCategory==='Semua'||t.category===reportCategory))borrowCounts.set(t.id,(borrowCounts.get(t.id)||0)+Number(i.qty||0))}));
 let sortedBorrow=[...borrowCounts].map(([id,count])=>({t:db.tools.find(t=>t.id===id),count})).filter(x=>x.t).sort((a,b)=>b.count-a.count);
 let issueCounts=new Map();
 db.loans.filter(l=>l.status==='Selesai'&&inReportPeriod(l.returnDate||l.start)).forEach(l=>{let cond=l.returnCondition||db.returns.find(r=>r.loanId===l.id)?.condition;if(!['Hilang','Rusak','Perlu Perbaikan'].includes(cond))return;l.items.forEach(i=>{let t=db.tools.find(x=>x.id===i.toolId);if(!t||(reportCategory!=='Semua'&&t.category!==reportCategory))return;let v=issueCounts.get(t.id)||{lost:0,damaged:0,total:0};if(cond==='Hilang')v.lost+=Number(i.qty||0);else v.damaged+=Number(i.qty||0);v.total+=Number(i.qty||0);issueCounts.set(t.id,v)})});
 let sortedIssues=[...issueCounts].map(([id,v])=>({t:db.tools.find(t=>t.id===id),...v})).filter(x=>x.t).sort((a,b)=>b.total-a.total);
 let teachers=db.users.filter(u=>u.role==='Guru'&&u.active);
 let teacherLoans=u=>periodLoans.filter(l=>l.userId===u.id&&['Disetujui','Selesai'].includes(l.status)&&l.items.some(i=>{let t=db.tools.find(x=>x.id===i.toolId);return t&&(reportCategory==='Semua'||t.category===reportCategory)}));
 let teacherCounts=teachers.map(u=>{let ls=teacherLoans(u);return {u,count:ls.length,units:ls.reduce((n,l)=>n+l.items.reduce((s,i)=>{let t=db.tools.find(x=>x.id===i.toolId);return s+(t&&(reportCategory==='Semua'||t.category===reportCategory)?Number(i.qty||0):0)},0),0)}}).sort((a,b)=>b.count-a.count);
 let neverBorrowed=teacherCounts.filter(x=>x.count===0);
 let leastBorrowed=db.tools.filter(t=>reportCategory==='Semua'||t.category===reportCategory).map(t=>({t,count:borrowCounts.get(t.id)||0})).sort((a,b)=>a.count-b.count);
 let outstandingRows=outstanding.map(({l,i,t})=>`<tr><td><b>${esc(l.code)}</b><div class="muted">${esc(l.borrower)}</div></td><td>${esc(t.name)}<div class="muted">${esc(t.code)}</div></td><td>${esc(t.category)}</td><td>${i.qty}</td><td>${l.start}</td><td>${l.due}</td><td>${l.due<today()?statusTag('Terlambat'):statusTag('Disetujui')}</td></tr>`);
 let frequentRows=sortedBorrow.map(x=>`<tr><td>${esc(x.t.code)}</td><td>${esc(x.t.name)}</td><td>${esc(x.t.category)}</td><td><b>${x.count}</b></td></tr>`);
 let issueRows=sortedIssues.map(x=>`<tr><td>${esc(x.t.code)}</td><td>${esc(x.t.name)}</td><td>${esc(x.t.category)}</td><td>${x.lost}</td><td>${x.damaged}</td><td><b>${x.total}</b></td></tr>`);
 let teacherRows=teacherCounts.filter(x=>x.count>0).map(x=>`<tr><td>${esc(x.u.name)}</td><td>${esc(x.u.username)}</td><td>${x.count}</td><td>${x.units}</td></tr>`);
 let neverRows=neverBorrowed.map(x=>`<tr><td>${esc(x.u.name)}</td><td>${esc(x.u.username)}</td><td>${esc(x.u.contact||'-')}</td><td>Tidak ada transaksi disetujui/selesai</td></tr>`);
 let leastRows=leastBorrowed.map(x=>`<tr><td>${esc(x.t.code)}</td><td>${esc(x.t.name)}</td><td>${esc(x.t.category)}</td><td><b>${x.count}</b></td></tr>`);
 return `${head('Laporan','Analisis inventaris, peminjaman, pengembalian, dan pemakaian alat','<button class="btn primary" onclick="exportCSV()">⇩ Ekspor CSV inventaris</button>')}
 <div class="reportcards"><div class="reportbox"><small>Total unit inventaris</small><strong>${total}</strong></div><div class="reportbox"><small>Transaksi aktif</small><strong>${active}</strong></div><div class="reportbox"><small>Transaksi selesai</small><strong>${done}</strong></div><div class="reportbox"><small>Terlambat</small><strong>${late}</strong></div><div class="reportbox"><small>Jenis alat</small><strong>${db.tools.length}</strong></div><div class="reportbox"><small>Total transaksi</small><strong>${db.loans.length}</strong></div></div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Filter laporan</h3><button class="btn outline" onclick="reportFrom='';reportTo='';reportCategory='Semua';refresh()">Reset filter</button></div><div class="panelbody"><div class="formgrid"><div class="field"><label>Tanggal mulai</label><input type="date" value="${reportFrom}" onchange="reportFrom=this.value;refresh()"></div><div class="field"><label>Tanggal akhir</label><input type="date" value="${reportTo}" onchange="reportTo=this.value;refresh()"></div><div class="field"><label>Kategori alat</label><select onchange="reportCategory=this.value;refresh()">${categories.map(c=>`<option value="${esc(c)}" ${reportCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><small class="muted">Periode aktivitas peminjaman menggunakan tanggal pinjam. Untuk laporan alat hilang/rusak menggunakan tanggal pengembalian. Kosongkan tanggal untuk melihat seluruh periode.</small></div></div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Inventaris belum dikembalikan</h3><span class="tag orange">${outstanding.length} baris alat</span></div>${reportTable(['Transaksi / Peminjam','Nama alat','Kategori','Jumlah','Tgl pinjam','Jatuh tempo','Status'],outstandingRows,'Tidak ada alat yang belum dikembalikan pada filter ini.')}</div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Alat paling sering dipinjam</h3></div>${reportTable(['Kode','Nama alat','Kategori','Total unit dipinjam'],frequentRows)}</div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Alat paling sering hilang atau rusak</h3></div>${reportTable(['Kode','Nama alat','Kategori','Hilang (unit)','Rusak / perlu perbaikan (unit)','Total kejadian unit'],issueRows,'Belum ada catatan alat hilang atau rusak pada periode ini.')}</div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Guru paling sering meminjam alat</h3></div>${reportTable(['Nama guru','Username','Jumlah transaksi','Total unit dipinjam'],teacherRows,'Belum ada transaksi peminjaman guru pada periode ini.')}</div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Guru yang tidak pernah meminjam selama periode</h3></div>${reportTable(['Nama guru','Username','Kontak','Keterangan'],neverRows,'Semua guru memiliki transaksi peminjaman pada periode ini.')}</div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Alat paling jarang dipinjam</h3></div>${reportTable(['Kode','Nama alat','Kategori','Total unit dipinjam'],leastRows,'Belum ada data peminjaman alat pada periode ini.')}</div>
 <div class="panel" style="margin-top:17px"><div class="panelhead"><h3>Rekap inventaris</h3><button class="btn outline" onclick="window.print()">Cetak</button></div>${reportTable(['Kode','Nama alat','Kondisi','Total','Dipinjam','Tersedia'],db.tools.map(t=>`<tr><td>${esc(t.code)}</td><td>${esc(t.name)}</td><td>${esc(t.condition)}</td><td>${t.total}</td><td>${activeQty(t)}</td><td>${available(t)}</td></tr>`))}</div>`;
}
function audit(){return `${head('Audit Log','Jejak aktivitas penting dan perubahan data')}<div class="panel"><div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aktivitas</th><th>Objek</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td>${esc(a.time)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.obj)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada aktivitas tercatat.</td></tr>'}</tbody></table></div></div>`}
function refresh(){let el=$('#view');if(!el)return;let views={dashboard,catalog,loans,inventory,returns:returnsPage,users,reports,notifications,audit};el.innerHTML=(views[page]||dashboard)()}
function go(p){page=p;filter='';statusFilter='Semua';render()}
function render(){if(!me){$('#root').innerHTML=`<div class="login"><section class="loginleft"><div class="brand"><div class="brandmark">S</div><div><b>SIPALI</b><small>BENGKEL TEKNOLOGI INFORMASI</small></div></div><h1>Inventaris lebih tertata.<br>Peminjaman lebih mudah.</h1><p>Sistem informasi pengelolaan inventaris dan peminjaman alat bengkel TI SMKN 1 Beringin.</p><div style="margin-top:50px;color:#9db7d2;font-size:11px">PLATFORM DIGITAL PENGELOLAAN LABORATORIUM</div></section><section class="loginright"><div class="loginbox"><h2>Selamat datang</h2><div class="sub">Masuk ke akun SIPALI untuk melanjutkan.</div><div class="field"><label>Username</label><input id="username" placeholder="Masukkan username" onkeydown="if(event.key==='Enter')login()"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Masukkan password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn primary" style="width:100%;justify-content:center;padding:12px" onclick="login()">Masuk ke SIPALI →</button><div class="demo"><b>Akun demo untuk uji coba</b><div>Admin/PLP: <b>admin</b> / admin123</div><div>Kepala Bengkel: <b>kepala</b> / kepala123</div><div>Guru: <b>guru</b> / guru123</div><div>Siswa: <b>siswa</b> / siswa123</div></div><p class="muted" style="font-size:10px;margin-top:22px">SIPALI v1.0 · SMKN 1 Beringin</p></div></section></div>`;return}$('#root').innerHTML=shell();refresh()}
function modal(title,body,submit,label='Simpan'){let b=document.createElement('div');b.className='modalback';b.id='modal';b.innerHTML=`<div class="modal"><div class="modalhead"><h3>${title}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button class="btn outline" onclick="closeModal()">Batal</button><button class="btn primary" id="modalSubmit">${label}</button></div></div>`;document.body.append(b);$('#modalSubmit').onclick=submit}
function closeModal(){$('#modal')?.remove()}
function openTool(id){let t=db.tools.find(x=>x.id===id)||{};modal(id?'Ubah data alat':'Tambah alat',`<div class="formgrid"><div class="field"><label>Kode inventaris *</label><input id="fcode" value="${esc(t.code||'')}" placeholder="TI-007"></div><div class="field"><label>Nama alat *</label><input id="fname" value="${esc(t.name||'')}"></div><div class="field"><label>Kategori</label><input id="fcat" value="${esc(t.category||'')}" placeholder="Jaringan"></div><div class="field"><label>Jumlah unit *</label><input id="ftotal" type="number" min="0" value="${t.total??1}"></div><div class="field"><label>Kondisi</label><select id="fcond">${['Baik','Perlu Perbaikan','Rusak'].map(x=>`<option ${t.condition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Ikon</label><input id="femoji" value="${t.emoji||'🧰'}"></div><div class="field span2"><label>Spesifikasi</label><textarea id="fspec">${esc(t.spec||'')}</textarea></div></div>`,()=>{let code=$('#fcode').value.trim(),name=$('#fname').value.trim(),total=Number($('#ftotal').value);if(!code||!name||!Number.isInteger(total)||total<0)return toast('Lengkapi kode, nama, dan jumlah unit yang valid');if(db.tools.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==id))return toast('Kode inventaris sudah digunakan');if(id){Object.assign(t,{code,name,category:$('#fcat').value,spec:$('#fspec').value,total,condition:$('#fcond').value,emoji:$('#femoji').value});log('Memperbarui inventaris',code)}else{db.tools.push({id:Date.now(),code,name,category:$('#fcat').value,spec:$('#fspec').value,total,condition:$('#fcond').value,emoji:$('#femoji').value,active:true});log('Menambahkan inventaris',code)}save();closeModal();refresh();toast('Data inventaris tersimpan')})}
function deleteTool(id){let t=db.tools.find(x=>x.id===id);if(db.loans.some(l=>l.status==='Disetujui'&&l.items.some(i=>i.toolId===id)))return toast('Alat masih dipinjam, tidak dapat dinonaktifkan');if(confirm(`Nonaktifkan ${t.name}?`)){t.active=false;log('Menonaktifkan inventaris',t.code);save();refresh()}}
function openUser(){modal('Tambah pengguna',`<div class="formgrid"><div class="field"><label>Nama lengkap *</label><input id="uname"></div><div class="field"><label>Username *</label><input id="uuser"></div><div class="field"><label>Password *</label><input id="upass" type="password"></div><div class="field"><label>Role</label><select id="urole"><option>Admin / PLP</option><option>Kepala Bengkel</option><option>Guru</option><option>Siswa</option></select></div><div class="field span2"><label>Email / kontak</label><input id="ucontact"></div></div>`,()=>{let name=$('#uname').value.trim(),username=$('#uuser').value.trim();if(!name||!username||!$('#upass').value)return toast('Nama, username, dan password wajib diisi');if(db.users.some(u=>u.username===username))return toast('Username sudah digunakan');db.users.push({id:Date.now(),name,username,password:$('#upass').value,role:$('#urole').value,contact:$('#ucontact').value,active:true});log('Membuat pengguna',username);save();closeModal();refresh();toast('Pengguna ditambahkan')})}
function toggleUser(id){let u=db.users.find(x=>x.id===id);if(u.id===me.id)return toast('Tidak dapat menonaktifkan akun sendiri');u.active=!u.active;log(u.active?'Mengaktifkan pengguna':'Menonaktifkan pengguna',u.username);save();refresh()}
function openLoan(toolId){let opts=db.tools.filter(t=>t.active&&available(t)>0);if(!opts.length)return toast('Tidak ada alat yang tersedia');modal('Form pengajuan peminjaman',`<div class="field"><label>Alat yang dipinjam *</label><select id="ltool">${opts.map(t=>`<option value="${t.id}" ${t.id===toolId?'selected':''}>${esc(t.name)} — tersedia ${available(t)}</option>`).join('')}</select></div><div class="field"><label>Jumlah unit *</label><input id="lqty" type="number" min="1" value="1"></div><div class="formgrid"><div class="field"><label>Tanggal pinjam *</label><input id="lstart" type="date" value="${today()}" min="${today()}"></div><div class="field"><label>Tanggal jatuh tempo *</label><input id="ldue" type="date" value="${plus(3)}" min="${today()}"></div></div><div class="field"><label>Tujuan / keterangan</label><textarea id="lnote" placeholder="Tuliskan keperluan penggunaan alat..."></textarea></div>`,()=>{let t=db.tools.find(x=>x.id===Number($('#ltool').value)),qty=Number($('#lqty').value),start=$('#lstart').value,due=$('#ldue').value;if(!Number.isInteger(qty)||qty<1||qty>available(t))return toast('Jumlah melebihi stok tersedia');if(!start||!due||due<start)return toast('Tanggal peminjaman/jatuh tempo tidak valid');let loan={id:Date.now(),code:'SIP-'+String(db.loans.length+1).padStart(4,'0'),userId:me.id,borrower:me.name,role:me.role,start,due,note:$('#lnote').value,items:[{toolId:t.id,qty}],status:'Menunggu Verifikasi',created:new Date().toLocaleString('id-ID')};db.loans.unshift(loan);notify(isAdmin()?1:1,'Pengajuan peminjaman baru',`${me.name} mengajukan ${t.name} (${qty} unit).`);log('Mengajukan peminjaman',loan.code);save();closeModal();page='loans';refresh();toast('Pengajuan berhasil dikirim')})}
function notify(userId,title,message){db.notifications.unshift({id:Date.now()+Math.random(),userId,title,message,time:new Date().toLocaleString('id-ID')})}
function decide(id,yes){let l=db.loans.find(x=>x.id===id);if(yes){for(let i of l.items){let t=db.tools.find(x=>x.id===i.toolId);if(!t||available(t)<i.qty)return toast('Stok berubah dan tidak mencukupi. Periksa kembali.')}l.status='Disetujui';l.verifier=me.name;notify(l.userId,'Peminjaman disetujui',`Pengajuan ${l.code} telah disetujui. Silakan koordinasikan pengambilan alat dengan PLP.`);log('Menyetujui peminjaman',l.code)}else{let reason=prompt('Alasan penolakan:');if(reason===null)return;l.status='Ditolak';l.reason=reason;notify(l.userId,'Peminjaman ditolak',`Pengajuan ${l.code} ditolak. Alasan: ${reason}`);log('Menolak peminjaman',l.code)}save();refresh()}
function cancelLoan(id){let l=db.loans.find(x=>x.id===id);if(confirm('Batalkan pengajuan ini?')){l.status='Ditolak';l.reason='Dibatalkan oleh peminjam';log('Membatalkan pengajuan',l.code);save();refresh()}}
function openReturn(id){let l=db.loans.find(x=>x.id===id);modal('Pemeriksaan pengembalian',`<div class="notice"><strong>${l.code} · ${esc(l.borrower)}</strong>${l.items.map(i=>`${esc(db.tools.find(t=>t.id===i.toolId)?.name||'Alat')} — ${i.qty} unit`).join('<br>')}</div><div class="field"><label>Kondisi setelah digunakan *</label><select id="rcond"><option>Baik</option><option>Perlu Perbaikan</option><option>Rusak</option><option>Hilang</option></select></div><div class="field"><label>Catatan pemeriksaan</label><textarea id="rnote" placeholder="Catatan kondisi, kelengkapan, atau kerusakan..."></textarea></div><div class="field"><label>Tanggal kembali</label><input id="rdate" type="date" value="${today()}"></div>`,()=>{let cond=$('#rcond').value,date=$('#rdate').value;if(!date)return toast('Tanggal kembali wajib diisi');l.status='Selesai';l.returnDate=date;l.returnCondition=cond;l.returnNote=$('#rnote').value;db.returns.push({loanId:l.id,date,condition:cond,note:l.returnNote,staff:me.name});l.items.forEach(i=>{let t=db.tools.find(x=>x.id===i.toolId);if(t)t.condition=cond});notify(l.userId,'Pengembalian dicatat',`Pengembalian ${l.code} telah dicatat dengan kondisi: ${cond}.`);log('Mencatat pengembalian',l.code+' — '+cond);save();closeModal();refresh();toast('Pengembalian berhasil dicatat')})}

// ===== IMPOR DATA EXCEL =====
let importState={type:null,rows:[],valid:[],errors:[]};
function downloadTemplate(type){
 if(!window.XLSX)return toast('Komponen Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
 let headers, sample, filename;
 if(type==='users'){
  headers=['nama','username','password','role','kontak','status'];
  sample=[['Contoh Nama','contoh.siswa','GantiPassword123','Siswa','nama@sekolah.sch.id','Aktif']];
  filename='Template_Impor_Pengguna_SIPALI.xlsx';
 }else{
  headers=['kode_inventaris','nama_alat','kategori','spesifikasi','jumlah_unit','kondisi','ikon'];
  sample=[['TI-007','Router Praktik','Jaringan','Gigabit, dual band',5,'Baik','📡']];
  filename='Template_Impor_Alat_SIPALI.xlsx';
 }
 let ws=XLSX.utils.aoa_to_sheet([headers,...sample]);
 ws['!cols']=headers.map(h=>({wch:Math.max(16,h.length+4)}));
 let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,type==='users'?'Pengguna':'Inventaris');
 XLSX.writeFile(wb,filename);
}
function openImport(type){
 if(!isAdmin())return toast('Hanya Admin/PLP yang dapat mengimpor data.');
 importState={type,rows:[],valid:[],errors:[]};
 let title=type==='users'?'Impor Data Pengguna':'Impor Data Inventaris Alat';
 let help=type==='users'
 ?'Kolom wajib: nama, username, password, role. Role harus Admin / PLP, Kepala Bengkel, Guru, atau Siswa. Status opsional: Aktif atau Nonaktif.'
 :'Kolom wajib: kode_inventaris, nama_alat, kategori, jumlah_unit. Kondisi: Baik, Perlu Perbaikan, atau Rusak.';
 modal(title,`<div class="notice"><strong>Petunjuk format Excel</strong>${help}<br>Unduh template Excel terlebih dahulu agar nama kolom sesuai.</div>
 <div class="field"><label>Pilih file Excel (.xlsx / .xls)</label><input id="excelFile" type="file" accept=".xlsx,.xls" onchange="parseImportFile(this.files[0])"></div>
 <div id="importPreview"><div class="empty">Belum ada file dipilih.</div></div>`,()=>commitImport(),'Impor data valid');
 $('#modalSubmit').disabled=true;
}
function parseImportFile(file){
 if(!file)return;
 if(!window.XLSX){toast('Komponen Excel belum termuat. Periksa koneksi internet.');return}
 if(!/\.(xlsx|xls)$/i.test(file.name)){toast('Pilih file Excel .xlsx atau .xls');return}
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array'});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
   validateImportRows(raw);
  }catch(err){toast('File Excel tidak dapat dibaca. Periksa format file.')}
 };
 reader.readAsArrayBuffer(file);
}
function validateImportRows(raw){
 const type=importState.type,seen=new Set(),valid=[],errors=[];
 const norm=v=>String(v??'').trim();
 raw.forEach((r,index)=>{
  const rowNo=index+2, obj={};
  Object.keys(r).forEach(k=>obj[String(k).trim().toLowerCase().replace(/\s+/g,'_')]=r[k]);
  let issue='';
  if(type==='users'){
   let name=norm(obj.nama),username=norm(obj.username),password=norm(obj.password),role=norm(obj.role),contact=norm(obj.kontak),status=norm(obj.status)||'Aktif';
   let key=username.toLowerCase();
   if(!name||!username||!password)issue='Nama, username, dan password wajib diisi';
   else if(!['Admin / PLP','Kepala Bengkel','Guru','Siswa'].includes(role))issue='Role tidak valid';
   else if(!['Aktif','Nonaktif'].includes(status))issue='Status harus Aktif atau Nonaktif';
   else if(db.users.some(u=>u.username.toLowerCase()===key)||seen.has(key))issue='Username sudah terdaftar/duplikat';
   if(!issue){seen.add(key);valid.push({name,username,password,role,contact,active:status==='Aktif'})}
  }else{
   let code=norm(obj.kode_inventaris),name=norm(obj.nama_alat),category=norm(obj.kategori),spec=norm(obj.spesifikasi),total=Number(norm(obj.jumlah_unit)),condition=norm(obj.kondisi)||'Baik',emoji=norm(obj.ikon)||'🧰';
   let key=code.toLowerCase();
   if(!code||!name||!category||norm(obj.jumlah_unit)==='')issue='Kode, nama, kategori, dan jumlah unit wajib diisi';
   else if(!Number.isInteger(total)||total<0)issue='Jumlah unit harus bilangan bulat ≥ 0';
   else if(!['Baik','Perlu Perbaikan','Rusak'].includes(condition))issue='Kondisi tidak valid';
   else if(db.tools.some(t=>t.code.toLowerCase()===key)||seen.has(key))issue='Kode inventaris sudah terdaftar/duplikat';
   if(!issue){seen.add(key);valid.push({code,name,category,spec,total,condition,emoji,active:true})}
  }
  if(issue)errors.push({row:rowNo,issue});
 });
 importState.rows=raw;importState.valid=valid;importState.errors=errors;
 const preview=$('#importPreview');
 preview.innerHTML=`<div class="reportcards" style="grid-template-columns:repeat(3,1fr);margin:12px 0"><div class="reportbox"><small>Baris dibaca</small><strong>${raw.length}</strong></div><div class="reportbox"><small>Siap diimpor</small><strong style="color:#128052">${valid.length}</strong></div><div class="reportbox"><small>Ditolak</small><strong style="color:#bd3939">${errors.length}</strong></div></div>
 ${errors.length?`<div style="max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>Baris Excel</th><th>Alasan</th></tr></thead><tbody>${errors.map(x=>`<tr><td>${x.row}</td><td>${esc(x.issue)}</td></tr>`).join('')}</tbody></table></div>`:''}
 <div class="muted" style="font-size:11px;margin-top:10px">Hanya baris valid yang akan diimpor. Data duplikat tidak akan menimpa data yang sudah ada.</div>`;
 $('#modalSubmit').disabled=valid.length===0;
}
function commitImport(){
 if(!isAdmin())return toast('Akses ditolak.');
 const {type,valid}=importState;
 if(!valid.length)return toast('Tidak ada data valid untuk diimpor.');
 if(type==='users'){
  valid.forEach(u=>db.users.push({id:Date.now()+Math.random(),...u}));
  log('Impor data pengguna',`${valid.length} akun`);
 }else{
  valid.forEach(t=>db.tools.push({id:Date.now()+Math.random(),...t}));
  log('Impor data inventaris',`${valid.length} alat`);
 }
 const count=valid.length;save();closeModal();refresh();toast(`${count} data berhasil diimpor`);
}

function exportCSV(){let rows=[['Kode','Nama Alat','Kategori','Kondisi','Total','Dipinjam','Tersedia'],...db.tools.map(t=>[t.code,t.name,t.category,t.condition,t.total,activeQty(t),available(t)])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='laporan-inventaris-sipali.csv';a.click();URL.revokeObjectURL(a.href)}
load();render();
</script></body></html>
